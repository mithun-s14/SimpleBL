name: keenan-wiki-ingest

# Ingestion must not run on the production web server: YouTube rate-limits and
# IP-blocks caption requests from cloud provider ranges. This job fetches the
# corpus and publishes it as a release asset that the backend reads.
#
# If GitHub's IPs get blocked too, the fallback is running `npm run ingest`
# on a local cron -- the script has no CI-specific dependencies.

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Re-walk the whole channel instead of only new videos'
        type: boolean
        default: false

# Needed to publish the corpus as a release asset.
permissions:
  contents: write

concurrency:
  group: keenan-ingest
  cancel-in-progress: false

env:
  CORPUS_TAG: keenan-corpus

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json

      # Caption fetching goes through youtube-transcript-api: YouTube now
      # requires a PO token for direct timedtext requests, so the Node clients
      # come back empty. See backend/ingest/fetch_transcripts.py.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm install --prefix backend
          pip install -r backend/ingest/requirements.txt

      # Incremental runs build on the existing corpus. A missing asset is the
      # normal first-run case, so this must not fail the job.
      - name: Restore previous corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p backend/data
          if gh release download "$CORPUS_TAG" --pattern keenan.db --dir backend/data; then
            echo "restored $(du -h backend/data/keenan.db | cut -f1) corpus"
          else
            echo "no existing corpus - starting a full backfill"
          fi

      - name: Ingest
        working-directory: backend
        env:
          KEENAN_CHANNEL_ID: ${{ secrets.KEENAN_CHANNEL_ID }}
          # Optional: without it, discovery falls back to youtubei.js.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        # No GROQ_API_KEY: ingestion never calls the LLM, and embeddings run locally.
        run: npm run ingest -- ${{ inputs.full && '--full' || '' }}

      - name: Publish corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$CORPUS_TAG" >/dev/null 2>&1 \
            || gh release create "$CORPUS_TAG" \
                 --title "Keenan Wiki corpus" \
                 --notes "Transcript corpus, rebuilt daily by keenan-ingest." \
                 --latest=false
          gh release upload "$CORPUS_TAG" backend/data/keenan.db --clobber
